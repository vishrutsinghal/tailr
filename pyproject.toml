[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0", "packaging==26.3"]
build-backend = "setuptools.build_meta"

[project]
name = "tailtrail"
version = "0.6.0"
description = "Local-first development guidance for smaller, evidence-backed coding workflows."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "TailTrail" }]
dependencies = []

[project.scripts]
tailtrail = "tailtrail.cli:main"

[tool.setuptools]
packages = ["tailtrail", "tailtrail.hosts", "tailtrail.install", "tailtrail.migrations"]
include-package-data = true

[tool.setuptools.package-data]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["*Tests"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "W503"]
