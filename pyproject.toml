[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tailtrail"
version = "0.6.0"
description = "Local-first development guidance for smaller, evidence-backed coding workflows."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "TailTrail" }]
dependencies = []

[project.scripts]
tailtrail = "tailtrail_cli:main"

[tool.setuptools]
py-modules = ["tailtrail_cli"]
include-package-data = true

[tool.setuptools.package-data]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["*Tests"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "W503"]

