name: Trust foundation

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  contract-and-installer:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install declared package build requirements
        run: python -m pip install setuptools==84.0.0 wheel==0.48.0 packaging==26.3
      - name: Compile scripts and contract tests
        run: python -m compileall -q scripts tests
      - name: Validate enterprise closure registry
        run: python scripts/enterprise-readiness.py validate
      - name: Validate repository and release manifest contracts
        run: python scripts/check-tailtrail.py
      - name: Audit public candidate documentation
        run: python scripts/public-doc-audit.py
      - name: Validate public release candidate
        run: python scripts/release-check.py
      - name: Run dependency-free unit and contract tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Build and inspect self-contained package artifacts
        if: matrix.python-version == '3.12'
        env:
          SOURCE_DATE_EPOCH: "1704067200"
        run: |
          python -m pip wheel . --no-deps --wheel-dir dist
          python setup.py sdist --dist-dir dist
          python scripts/package-release-proof.py --wheel dist/tailtrail-0.6.0-py3-none-any.whl --sdist dist/tailtrail-0.6.0.tar.gz
      - name: Validate feature registry
        run: python scripts/tailtrail-registry.py validate --strict
      - name: Verify adapter guidance contracts
        run: python scripts/tailtrail.py adapters check
      - name: Build change diff for enforcement
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git diff --unified=3 "$BASE_SHA" "$GITHUB_SHA" > "$RUNNER_TEMP/tailtrail-guard.diff"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git diff --unified=3 HEAD^ HEAD > "$RUNNER_TEMP/tailtrail-guard.diff"
          else
            git show --format= --unified=3 HEAD > "$RUNNER_TEMP/tailtrail-guard.diff"
          fi
      - name: Enforce selected Guard CLI classes against the change diff
        run: python scripts/tailtrail.py guard check --diff "$RUNNER_TEMP/tailtrail-guard.diff" --fail-on safeguard-removal,local-state,validation-claim
      - name: Validate dependency decisions against the change diff
        run: python scripts/tailtrail.py dependency check --diff "$RUNNER_TEMP/tailtrail-guard.diff"
      - name: Fresh-clone installer smoke test
        run: python scripts/smoke-test.py
